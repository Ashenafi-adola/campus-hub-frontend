name: Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------
      # Checkout repository
      # ------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------
      # Setup Node.js
      # ------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"


      # ------------------------------
      # Install dependencies
      # ------------------------------

      - name: Install dependencies
        run: npm ci


      # ------------------------------
      # ESLint
      # ------------------------------

      - name: Run ESLint
        run: npm run lint


      # ------------------------------
      # TypeScript
      # ------------------------------

      - name: Type check
        run: npx tsc --noEmit


      # ------------------------------
      # Production build
      # ------------------------------

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws